  <style>
    :root{color-scheme:dark;--green:#00ff88;--soft:#8dffbe}
*{box-sizing:border-box}

#statusBox{right:24px;text-align:right}
.title{font-size:clamp(1.5rem,4vw,3.4rem);font-weight:700;line-height:1;letter-spacing:.08em}
.small{margin-top:5px;font-size:.88rem;letter-spacing:.12em;opacity:.9}

#sendButton,#fileButton{padding:12px 17px;cursor:pointer;letter-spacing:.05em}
button:hover,button:focus-visible{background:var(--green)!important;color:#001b0e!important}
#fileInput{display:none}

to{opacity:1;filter:blur(0);transform:scale(1)}
}
@keyframes fade-in{from{opacity:0;transform:translateY(5px)}
to{opacity:1;transform:none}
}

.capability b{display:block;color:var(--green);letter-spacing:.12em;font-size:.8rem}
.capability span{font-size:.78rem;line-height:1.3}

#statusBox{right:12px}
.small{font-size:.66rem}
#responseWrap{bottom:132px;width:92%;height:42vh;max-height:calc(100vh - 225px);padding:16px}
#chatBar{bottom:16px;width:94%;gap:6px}
#chatInput{padding:13px;min-width:60px}
#sendButton,#fileButton{padding:11px;font-size:.76rem}
#notice{bottom:98px;width:90%;font-size:.68rem}
#launcher{top:48%;width:92%}
.capabilities{grid-template-columns:repeat(2,1fr)}
.examples{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){#wave{display:none}
#startup{display:none}
.bootNeo,.bootStatus{animation:none}
}

function onRecognitionResult(event){if(state.speaking)return;let finalText="";for(let i=event.resultIndex;i<event.results.length;i++){const result=event.results[i];if(result.isFinal){finalText+=result[0].transcript+" ";log("HEARD FINAL",result[0].transcript)}else log("HEARD INTERIM",result[0].transcript)}if(!finalText.trim())return;state.finalParts.push(finalText.trim());clearTimeout(state.utteranceTimer);state.utteranceTimer=setTimeout(()=>{const text=state.finalParts.join(" ").replace(/\s+/g," ").trim();state.finalParts=[];if(text)handleSpeech(text)},SILENCE_MS)}
function normalized(text){return text.toLowerCase().replace(/[^a-z0-9\s']/g," ").replace(/\s+/g," ").trim()}
function handleSpeech(raw){const text=normalized(raw);if(!text||state.speaking)return;log("USER UTTERANCE",text);if(/\b(neo off|go to sleep|standby)\b/.test(text)){stopSpeaking(false);setActive(false);setResponse("STANDBY");return}if(/\bunmute\b/.test(text)){setVoiceEnabled(true);speak("I’m back.");return}if(/\bmute\b/.test(text)){setVoiceEnabled(false,true);return}if(/\bstop\b/.test(text)){stopSpeaking(true);return}const wake=text.match(/^(?:hey\s+)?neo(?:\s+on)?\b\s*(.*)$/);if(!state.active){if(!wake)return;dismissHome();setActive(true);log("WAKE WORD DETECTED");const remainder=wake[1].trim();if(remainder){submitQuestion(remainder)}else speak(["Hey.","Yeah?","I’m here.","What’s up?","Go ahead."][Math.floor(Math.random()*5)]);return}if(wake&&wake[1].trim())submitQuestion(wake[1].trim());else submitQuestion(raw.trim())}
function trimHistory(){const system=state.history[0];state.history=[system,...state.history.slice(-(MAX_HISTORY))]}
function errorLabel(status,detail){if(status===400)return "AI REQUEST ERROR";if(status===401)return "AUTHENTICATION FAILED";if(status===403)return "ACCESS DENIED";if(status===404)return "MODEL UNAVAILABLE";if(status===429)return "RATE LIMIT REACHED";if(status>=500)return "AI SERVICE UNAVAILABLE";return detail||"AI RESPONSE ERROR"}
async function requestAI(messages){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),30000);try{log("API REQUEST START",API_ENDPOINT);const response=await fetch(API_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages}),signal:controller.signal});const contentType=response.headers.get("content-type")||"";const raw=await response.text();log("API HTTP STATUS",response.status,"CONTENT TYPE",contentType);if(!contentType.toLowerCase().includes("application/json")){log("API RESPONSE PARSE FAILURE",raw.slice(0,160));throw new Error("AI service unavailable on this deployment.")}let data;try{data=JSON.parse(raw);log("API RESPONSE PARSE SUCCESS")}catch{log("API RESPONSE PARSE FAILURE",raw.slice(0,160));throw new Error("AI service returned an invalid response.")}if(!response.ok||data.ok!==true){throw new Error(errorLabel(response.status,data.error||"AI service unavailable."))}if(typeof data.text!=="string"||!data.text.trim())throw new Error("AI service returned an invalid response.");log("API RESPONSE RECEIVED");return data.text.trim()}catch(error){if(error.name==="AbortError")throw new Error("NETWORK ERROR: request timed out");throw error}finally{clearTimeout(timer)}}
async function submitQuestion(question){if(!question||state.speaking)return;const fingerprint=normalized(question);if(fingerprint===state.lastSubmission)return;state.lastSubmission=fingerprint;setTimeout(()=>state.lastSubmission="",1500);state.active=true;state.muted?setStatus("MUTED"):setStatus("THINKING");setResponse("THINKING...");const content=state.documentText?`${question}\n\nUploaded document context (may be truncated):\n${state.documentText}`:question;state.history.push({role:"user",content});trimHistory();try{log("AI REQUEST START");const answer=await requestAI(state.history);state.history.push({role:"assistant",content:answer});trimHistory();log("AI RESPONSE RECEIVED");speak(answer)}catch(error){log("API ERROR",error.message);state.history.pop();setResponse(error.message);if(state.active&&!state.muted)setStatus("LISTENING")}}
$("chatBar").addEventListener("submit",e=>{e.preventDefault();const input=$("chatInput"),text=input.value.trim();if(!text)return;dismissHome();input.value="";if(!state.active)setActive(true);submitQuestion(text)});
$("copyButton").onclick=async()=>{try{await navigator.clipboard.writeText($("responseBox").textContent);$("copyButton").textContent="COPIED";setTimeout(()=>$("copyButton").textContent="COPY",1200)}catch{$("notice").textContent="Copy was blocked by this browser."}};
const allowedExtensions=new Set(["txt","csv","json","md","html","htm","js","css","xml"]);$("fileButton").onclick=()=>$("fileInput").click();$("fileInput").addEventListener("change",async e=>{const file=e.target.files[0];e.target.value="";if(!file)return;const ext=(file.name.split(".").pop()||"").toLowerCase();if(!allowedExtensions.has(ext)){dismissHome();setResponse(`${file.name}\n\n${ext==="pdf"?"PDF parsing isn’t enabled in this version yet.":"This file type is not supported in Beta v2 yet."}`);return}try{const text=await file.text();dismissHome();state.documentText=text.slice(0,MAX_DOCUMENT);setResponse(`FILE LOADED\n${file.name}\n${file.type||"text-based file"}\n${file.size.toLocaleString()} bytes\n\nNeo can now answer questions about this document.`);if(!state.muted)speak("File loaded. I can answer questions about it.")}catch{setResponse("FILE READ ERROR\nNeo could not read that file.")}});
const promptExamples={ASK:["Help me compare two options","Explain something I'm curious about","Answer a quick question"],LEARN:["Teach me derivatives simply","Explain a physics concept","Quiz me on something"],BUILD:["Help me build a website","Debug my JavaScript","Help plan a coding project"],SOLVE:["Walk me through a calculation","Help troubleshoot a problem","Help solve an engineering problem"],CREATE:["Brainstorm an idea with me","Help me write something","Turn my idea into a plan"],ANALYZE:["Analyze an uploaded text file","Summarize a CSV","Find patterns in this information"]};
document.querySelectorAll(".capability").forEach(button=>button.addEventListener("click",()=>{const examples=$("examples");examples.innerHTML="";for(const text of promptExamples[button.dataset.category]){const item=document.createElement("button");item.className="example";item.type="button";item.textContent=text;item.onclick=()=>{$("chatInput").value=text;$("chatInput").focus()};examples.append(item)}examples.classList.add("show")}));
$("micToggle").onclick=()=>setMicEnabled(!state.micEnabled);$("voiceToggle").onclick=()=>setVoiceEnabled(state.muted,true);
const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches,stages=["INITIALIZING","VOICE INTERFACE","AI CORE","SYSTEM READY"];function finishStartup(){$("startup").classList.add("done");setTimeout(revealLauncher,reduced?0:80)}if(reduced){finishStartup()}else stages.forEach((stage,index)=>setTimeout(()=>{$("bootStatus").textContent=stage;if(index===stages.length-1)setTimeout(finishStartup,430)},index*570));
initMic();
</script></body></html>
